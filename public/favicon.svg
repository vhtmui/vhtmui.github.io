<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img"
    aria-label="useless 科技 logo">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1E293B" />
            <stop offset="1" stop-color="#0B1120" />
        </linearGradient>
        <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" />
            <stop offset="1" stop-color="#CBD5E1" />
        </linearGradient>
    </defs>

    <!-- 圆角方块底 -->
    <rect width="160" height="160" rx="36" fill="url(#bg)" />

    <!-- u：品牌首字母 -->
    <path d="M48 46 V88 A32 32 0 0 0 112 88 V46"
        fill="none" stroke="url(#mark)" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round" />

    <!-- 信号节点：右臂顶端的科技接口 -->
    <circle cx="112" cy="46" r="12" fill="#3B82F6" />
</svg>
