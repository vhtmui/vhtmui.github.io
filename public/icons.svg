<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" role="img"
    aria-label="useless logo">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1E293B" />
            <stop offset="1" stop-color="#0B1120" />
        </linearGradient>
        <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" />
            <stop offset="1" stop-color="#CBD5E1" />
        </linearGradient>
    </defs>

    <!-- 图标：与 favicon 同源，等比缩放至 80 -->
    <g transform="translate(10 10) scale(0.5)">
        <rect width="160" height="160" rx="36" fill="url(#bg)" />
        <path d="M48 46 V88 A32 32 0 0 0 112 88 V46"
            fill="none" stroke="url(#mark)" stroke-width="17"
            stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="112" cy="46" r="12" fill="#3B82F6" />
    </g>

    <!-- 品牌名 -->
    <text x="112" y="56"
        font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="56" font-weight="700" fill="#0F172A"
        letter-spacing="-1">useless</text>

    <!-- 副标题 -->
    <text x="113" y="84"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="600" fill="#64748B"
        letter-spacing="4">TECHNOLOGY</text>
</svg>
